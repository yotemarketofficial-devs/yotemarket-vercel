<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#7C2BD4" />
    <title>YoteMarket — Shop Local. Delivered Fast.</title>
    <meta
      name="description"
      content="YoteMarket is Kenya's virtual mall — shop 200+ local stores, watch &amp; buy from YoteFeed shoppable videos, chat &amp; negotiate in-app, pay with M-Pesa, and collect at your nearest hub."
    />
    <!-- Canonical + robots are set PER ROUTE by src/components/RouteSeo.jsx. A
         hardcoded canonical here ships on every URL and tells Google that /about,
         /pricing, /careers etc. are all duplicates of the homepage — which quietly
         undoes sitemap.xml. The values below are only the homepage's defaults and
         the first paint before RouteSeo runs. -->
    <link rel="canonical" href="https://yotemarket.co.ke/" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph / social -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="YoteMarket" />
    <meta property="og:title" content="YoteMarket — Shop Local. Delivered Fast." />
    <meta
      property="og:description"
      content="Kenya's virtual mall — shop local stores, watch &amp; buy from YoteFeed videos, chat &amp; negotiate, pay with M-Pesa, and collect at your nearest hub."
    />
    <meta property="og:image" content="/assets/hero-bg.png" />
    <meta property="og:url" content="https://yotemarket.co.ke/" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="YoteMarket — Shop Local. Delivered Fast." />
    <meta
      name="twitter:description"
      content="Kenya's virtual mall — shop local stores, watch &amp; buy from YoteFeed videos, chat &amp; negotiate, pay with M-Pesa, and collect at your nearest hub."
    />
    <meta name="twitter:image" content="/assets/hero-bg.png" />

    <!-- Structured data (schema.org) — machine-readable facts about YoteMarket for
         search engines AND AI answer engines (Gemini, Copilot, ChatGPT, Perplexity).
         Ships on every route (site-wide identity); page meta stays per-route via RouteSeo. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": ["Organization", "OnlineStore"],
          "@id": "https://yotemarket.co.ke/#organization",
          "name": "YoteMarket",
          "legalName": "Yote Market Limited",
          "alternateName": "Yote Market",
          "url": "https://yotemarket.co.ke",
          "logo": "https://yotemarket.co.ke/assets/logo.png",
          "image": "https://yotemarket.co.ke/assets/hero-bg.png",
          "slogan": "Shop Local. Delivered Fast.",
          "description": "YoteMarket is Kenya's virtual mall — an online marketplace where hundreds of local Kenyan shops each get a branded storefront. Shoppers browse stores, chat and negotiate with sellers in the in-app messenger, pay securely with M-Pesa held in escrow, and collect from the nearest pickup hub or have a rider deliver. YoteFeed is YoteMarket's shoppable short-form video feed, where stores post clips shoppers can watch and buy from instantly. Sellers get product management, a Point-of-Sale terminal, KRA-compliant tax invoices, an M-Pesa wallet with payouts, and YoteAI tools that write listings and surface demand insights — all on a flat monthly subscription with no sales commission. Scouts sign up merchants and zero-hour riders deliver from neighbourhood hubs.",
          "areaServed": { "@type": "Country", "name": "Kenya" },
          "founder": [
            {
              "@type": "Person",
              "name": "Moses Kiambi",
              "jobTitle": "Chief Executive Officer (CEO)",
              "description": "Sets YoteMarket's vision and strategy — product direction, growth and partnerships — uniting branded storefronts, YoteFeed, M-Pesa payments and last-mile delivery into one Kenya-first commerce platform.",
              "knowsAbout": ["business strategy", "product leadership", "growth and partnerships", "e-commerce", "startup leadership"]
            },
            {
              "@type": "Person",
              "name": "Arnold Kamau",
              "jobTitle": "Chief Operating Officer (COO)",
              "description": "Leads YoteMarket's operations end to end — the pickup-hub and rider delivery network, merchant onboarding and the scout program — building the logistics and processes that let local shops fulfil orders reliably nationwide.",
              "knowsAbout": ["operations management", "logistics and last-mile delivery", "process design", "merchant onboarding", "scaling operations"]
            }
          ],
          "knowsAbout": [
            "online marketplace",
            "e-commerce in Kenya",
            "YoteFeed shoppable short-form video",
            "in-app chat and price negotiation",
            "M-Pesa payments and escrow",
            "last-mile delivery and pickup hubs",
            "point of sale for shops",
            "AI tools for merchants"
          ],
          "sameAs": [
            "https://www.facebook.com/yotemarket",
            "https://www.instagram.com/yotemarket_",
            "https://x.com/yotemarket",
            "https://www.tiktok.com/@yotemarket",
            "https://www.linkedin.com/company/yotemarket",
            "https://www.youtube.com/@yotemarket"
          ]
        },
        {
          "@type": "WebSite",
          "@id": "https://yotemarket.co.ke/#website",
          "url": "https://yotemarket.co.ke",
          "name": "YoteMarket",
          "inLanguage": "en-KE",
          "publisher": { "@id": "https://yotemarket.co.ke/#organization" }
        }
      ]
    }
    </script>

    <link rel="icon" href="/assets/favicon.png" />
    <link rel="apple-touch-icon" href="/assets/app_icon.png" />

    <!-- Performance: warm up the font + icon CDNs -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Poppins:wght@300;400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- Instant branded boot splash: pure inline CSS so it paints before the JS
         bundle loads (no white flash). React replaces #root's contents on mount,
         so it disappears automatically once the app is interactive. -->
    <style>
      #ym-boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
        background:radial-gradient(60% 55% at 50% 40%,rgba(124,43,212,.10),transparent 70%),#FFFFFF;
        font-family:'Poppins',system-ui,sans-serif;z-index:9999;}
      #ym-boot .s{display:flex;flex-direction:column;align-items:center;gap:26px;}
      #ym-boot .lg{width:190px;max-width:56vw;height:auto;display:block;animation:ymb-rise .7s cubic-bezier(.22,.7,.2,1) both;}
      #ym-boot .lg-dark{display:none;}
      #ym-boot .bar{position:relative;width:150px;height:4px;border-radius:999px;overflow:hidden;background:rgba(124,43,212,.14);}
      #ym-boot .bar>i{position:absolute;top:0;bottom:0;width:45%;border-radius:999px;
        background:linear-gradient(90deg,transparent,#7C2BD4,transparent);animation:ymb-prog 1.25s cubic-bezier(.65,.05,.36,1) infinite;}
      @keyframes ymb-rise{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
      @keyframes ymb-prog{0%{transform:translateX(-140%)}100%{transform:translateX(320%)}}
      @media (prefers-color-scheme:dark){
        #ym-boot{background:radial-gradient(60% 55% at 50% 40%,rgba(124,43,212,.26),transparent 70%),#0E0620;}
        #ym-boot .lg-light{display:none;}
        #ym-boot .lg-dark{display:block;}
      }
      @media (prefers-reduced-motion:reduce){ #ym-boot .bar>i{animation:none;} }
    </style>
    <div id="root">
      <div id="ym-boot">
        <div class="s">
          <img class="lg lg-light" src="/assets/logo.png" alt="YoteMarket" />
          <img class="lg lg-dark" src="/assets/logo-white.png" alt="YoteMarket" />
          <div class="bar"><i></i></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
