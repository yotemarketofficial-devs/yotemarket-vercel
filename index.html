<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#7C2BD4" />
    <title>YoteMarket — Shop Local. Delivered Fast.</title>
    <meta
      name="description"
      content="YoteMarket is Kenya's virtual mall — shop 200+ local stores, chat &amp; negotiate in the app, pay with M-Pesa, and collect at your nearest hub. Sell, deliver, and earn on one platform."
    />
    <link rel="canonical" href="https://yotemarket.com/" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph / social -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="YoteMarket" />
    <meta property="og:title" content="YoteMarket — Shop Local. Delivered Fast." />
    <meta
      property="og:description"
      content="Kenya's virtual mall — shop local stores, pay with M-Pesa, and collect at your nearest hub."
    />
    <meta property="og:image" content="/assets/hero-bg.png" />
    <meta property="og:url" content="https://yotemarket.com/" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="YoteMarket — Shop Local. Delivered Fast." />
    <meta
      name="twitter:description"
      content="Kenya's virtual mall — shop local stores, pay with M-Pesa, and collect at your nearest hub."
    />
    <meta name="twitter:image" content="/assets/hero-bg.png" />

    <link rel="icon" href="/assets/favicon.png" />
    <link rel="apple-touch-icon" href="/assets/app_icon.png" />

    <!-- Performance: warm up the font + icon CDNs -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Poppins:wght@300;400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- Instant branded boot splash: pure inline CSS so it paints before the JS
         bundle loads (no white flash). React replaces #root's contents on mount,
         so it disappears automatically once the app is interactive. -->
    <style>
      #ym-boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
        background:radial-gradient(60% 55% at 50% 32%,rgba(124,43,212,.12),transparent 70%),#FFFFFF;
        font-family:'Poppins',system-ui,sans-serif;z-index:9999;}
      #ym-boot .s{display:flex;flex-direction:column;align-items:center;gap:22px;}
      #ym-boot .m{position:relative;width:96px;height:96px;display:grid;place-items:center;}
      #ym-boot .ic{width:72px;height:72px;border-radius:20px;display:block;
        box-shadow:0 18px 40px -14px rgba(124,43,212,.65);animation:ymb-breathe 2.4s cubic-bezier(.65,.05,.36,1) infinite;}
      #ym-boot .rg{position:absolute;inset:0;border-radius:50%;
        background:conic-gradient(from 90deg,transparent 0%,transparent 28%,rgba(124,43,212,.55) 72%,#7C2BD4 100%);
        -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 4px),#000 calc(100% - 3.5px));
                mask:radial-gradient(farthest-side,transparent calc(100% - 4px),#000 calc(100% - 3.5px));
        animation:ymb-spin 1.05s linear infinite;}
      #ym-boot .wd{font-weight:800;font-size:24px;letter-spacing:-.02em;line-height:1;}
      #ym-boot .wd .a{color:#1C1233;}
      #ym-boot .wd .b{background:linear-gradient(115deg,#7C2BD4,#A020F0);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;}
      #ym-boot .bar{position:relative;width:168px;height:4px;border-radius:999px;overflow:hidden;background:rgba(124,43,212,.14);}
      #ym-boot .bar>i{position:absolute;top:0;bottom:0;width:45%;border-radius:999px;
        background:linear-gradient(90deg,transparent,#7C2BD4,transparent);animation:ymb-prog 1.25s cubic-bezier(.65,.05,.36,1) infinite;}
      @keyframes ymb-spin{to{transform:rotate(360deg)}}
      @keyframes ymb-breathe{0%,100%{transform:scale(1);opacity:.85}50%{transform:scale(1.06);opacity:1}}
      @keyframes ymb-prog{0%{transform:translateX(-140%)}100%{transform:translateX(320%)}}
      @media (prefers-color-scheme:dark){
        #ym-boot{background:radial-gradient(60% 55% at 50% 32%,rgba(124,43,212,.28),transparent 70%),#0E0620;}
        #ym-boot .wd .a{color:#F3ECFD;}
      }
      @media (prefers-reduced-motion:reduce){
        #ym-boot .ic,#ym-boot .bar>i{animation:none;}
        #ym-boot .rg{animation-duration:2s;}
      }
    </style>
    <div id="root">
      <div id="ym-boot">
        <div class="s">
          <div class="m">
            <span class="rg"></span>
            <img class="ic" src="/assets/app_icon.png" alt="YoteMarket" />
          </div>
          <div class="wd"><span class="a">Yote</span><span class="b">Market</span></div>
          <div class="bar"><i></i></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
