  <body>
    <!-- Instant branded boot splash: pure inline CSS so it paints before the JS
         bundle loads (no white flash). React replaces #root's contents on mount,
         so it disappears automatically once the app is interactive. -->
    <style>
      #ym-boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
        background:radial-gradient(60% 55% at 50% 40%,rgba(124,43,212,.10),transparent 70%),#FFFFFF;
        font-family:'Poppins',system-ui,sans-serif;z-index:9999;}
      #ym-boot .s{display:flex;flex-direction:column;align-items:center;gap:26px;}
      #ym-boot .lg{width:190px;max-width:56vw;height:auto;display:block;animation:ymb-rise .7s cubic-bezier(.22,.7,.2,1) both;}
      #ym-boot .lg-dark{display:none;}
      #ym-boot .bar{position:relative;width:150px;height:4px;border-radius:999px;overflow:hidden;background:rgba(124,43,212,.14);}
      #ym-boot .bar>i{position:absolute;top:0;bottom:0;width:45%;border-radius:999px;
        background:linear-gradient(90deg,transparent,#7C2BD4,transparent);animation:ymb-prog 1.25s cubic-bezier(.65,.05,.36,1) infinite;}
      @keyframes ymb-rise{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
      @keyframes ymb-prog{0%{transform:translateX(-140%)}100%{transform:translateX(320%)}}
      @media (prefers-color-scheme:dark){
        #ym-boot{background:radial-gradient(60% 55% at 50% 40%,rgba(124,43,212,.26),transparent 70%),#0E0620;}
        #ym-boot .lg-light{display:none;}
        #ym-boot .lg-dark{display:block;}
      }
      @media (prefers-reduced-motion:reduce){ #ym-boot .bar>i{animation:none;} }
    </style>
    <div id="root">
      <div id="ym-boot">
        <div class="s">
          <img class="lg lg-light" src="/assets/logo.png" alt="YoteMarket" />
          <img class="lg lg-dark" src="/assets/logo-white.png" alt="YoteMarket" />
          <div class="bar"><i></i></div>
        </div>
      </div>
    </div>
    <!-- Crawler-readable body. This is a client-rendered SPA: Googlebot runs JS, but most
         company-directory, AI and link-preview crawlers do NOT, and would otherwise see an
         empty page. The structured data above tells them the facts; this tells them the
         same in prose, and gives them real links to follow into the site. -->
    <noscript>
      <h1>YoteMarket — Kenya's virtual mall</h1>
      <p>
        YoteMarket is an online marketplace where hundreds of local Kenyan shops each get a branded
        storefront. Shoppers browse stores, chat and negotiate with sellers in the in-app messenger,
        pay with M-Pesa held in escrow, and collect from the nearest pickup hub or have a rider
        deliver. YoteFeed is our shoppable short-form video feed: stores post clips and shoppers buy
        from them on the spot.
      </p>
      <p>
        Sellers get product management, a Point-of-Sale terminal, KRA-compliant tax invoices, an
        M-Pesa wallet with payouts, and YoteAI tools that write listings and surface demand
        insights — on a flat monthly subscription with no commission on sales. Scouts sign up new
        merchants and zero-hour riders deliver batched orders from neighbourhood hubs.
      </p>
      <p>
        Founded by Moses Kiambi (Chief Executive Officer), who leads marketing strategy, brand and
        user acquisition, and Arnold Kamau (Chief Operating Officer), who is responsible for product
        and technology, operations and logistics, merchant systems, finance and compliance.
      </p>
